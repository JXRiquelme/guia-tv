name: Compilar TVOD para Windows

on:
  push:
    branches: [main]
    paths: ["win/**", ".github/workflows/win.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compilar
        run: dotnet publish win/TVOD/TVOD.csproj -c Release -o win/out -p:DebugType=None
      - name: Reproductor (libmpv)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p mpvdev
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-2*" -D mpvdev \
            || gh release download --repo zhongfly/mpv-winbuild --pattern "mpv-dev-x86_64-2*" -D mpvdev
          ls mpvdev
          7z x mpvdev/*.7z -ompvdev/x > /dev/null
          cp mpvdev/x/libmpv-2.dll win/out/
          ls -la win/out
      - name: Empaquetar
        shell: pwsh
        run: Compress-Archive -Path win/out/* -DestinationPath TVOD-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tvod-windows
          path: TVOD-Windows.zip
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lite-win
          name: TVOD para Windows
          body: |
            TVOD para Windows 10/11 (64 bits). Descomprime y abre TVOD.exe.
          files: TVOD-Windows.zip
          make_latest: false

  # Prueba de humo: abre la app con una lista pública de prueba y saca capturas de pantalla.
  smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tvod-windows
      - name: Abrir y capturar
        shell: pwsh
        run: |
          Expand-Archive TVOD-Windows.zip -DestinationPath app
          '{"list":"https://raw.githubusercontent.com/JXRiquelme/guia-tv/main/win/test/prueba.m3u"}' | Set-Content app/account.json
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD/shots/$name.png")
          }
          New-Item -ItemType Directory shots | Out-Null
          $p = Start-Process app/TVOD.exe -PassThru
          Start-Sleep 25
          Shot "1-inicio"
          $ws = New-Object -ComObject WScript.Shell
          $ws.AppActivate($p.Id) | Out-Null
          Start-Sleep 1
          $ws.SendKeys("{LEFT}"); Start-Sleep 3; Shot "2-lista"
          $ws.SendKeys("{ESC}"); Start-Sleep 1
          $ws.SendKeys("{RIGHT}"); Start-Sleep 3; Shot "3-guia"
          $ws.SendKeys("{ESC}"); Start-Sleep 1
          $ws.SendKeys("i"); Start-Sleep 2; Shot "4-info"
          $ws.SendKeys("{DOWN}"); Start-Sleep 8; Shot "5-zap"
          "Proceso vivo: $(-not $p.HasExited)"
          $log = "$env:LOCALAPPDATA/TVOD/errores.log"
          if (Test-Path $log) { Get-Content $log } else { "sin errores.log" }
          if (-not $p.HasExited) { Stop-Process $p }
      - name: Subir capturas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots && 7z a ../capturas.zip *.png > /dev/null && cd ..
          gh release view win-pruebas -R ${{ github.repository }} > /dev/null 2>&1 || gh release create win-pruebas -R ${{ github.repository }} --prerelease --title "Pruebas Windows" --notes "Capturas de la prueba automática"
          gh release upload win-pruebas capturas.zip --clobber -R ${{ github.repository }}
