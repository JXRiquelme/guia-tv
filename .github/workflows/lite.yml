name: Compilar AerioTV Lite

on:
  push:
    branches: [main]
    paths: ["lite/**", ".github/workflows/lite.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compilar
        working-directory: lite
        run: gradle --no-daemon :app:assembleRelease
      - name: Preparar APK
        run: cp lite/app/build/outputs/apk/release/app-release.apk aeriotv-lite.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aeriotv-lite
          path: aeriotv-lite.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lite
          name: AerioTV Lite
          body: APK de AerioTV Lite (se actualiza con cada compilación).
          files: aeriotv-lite.apk
          make_latest: true
