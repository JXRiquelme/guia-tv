name: Compilar AerioTV Lite para Mac

on:
  push:
    branches: [main]
    paths: ["mac/**", "lite/cloud.properties", ".github/workflows/mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # arm64 = chip Apple nativo; x86_64 (Intel) también corre en chip Apple vía Rosetta
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Elegir Xcode 26 (diseño Liquid Glass)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcrun swiftc --version
      - name: Instalar mpv
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install mpv dylibbundler
      - name: Compilar
        run: bash mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aeriotv-lite-mac-${{ matrix.runner }}
          path: mac/build/AerioTV-Lite-Mac-*.zip
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lite-mac
          name: AerioTV Lite para Mac
          body: |
            AerioTV Lite para Mac (macOS 15 o superior).
            - AerioTV-Lite-Mac-arm64.zip: Mac con chip Apple (recomendado).
            - AerioTV-Lite-Mac-x86_64.zip: Mac Intel (también funciona en chip Apple con Rosetta).
          files: mac/build/AerioTV-Lite-Mac-*.zip
          make_latest: false
